<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        .main{
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
        }
        button{
            font-size: 24px;
            padding: 10px 20px;
            background-color: rgb(65, 10, 82);
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out;
            color: white;
            border-radius: 5px;
            margin-top: 20px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
        }
        button:hover{
            background-color: rgb(193, 29, 235);
        }
        .div{
            width: 100px;
            height: 100px;
            background-color: pink;
            margin: 20px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
            transition: transform 0.3s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: xx-large;
            font-weight: bolder;
            cursor: pointer;
        }
        .div:hover {
            transform: scale(1.1);
        }
        .one, .two, .three, .four{
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        #display {
            width: 80%;
            max-width: 500px;
            height: 60px;
            background-color: #fff;
            margin: 20px;
            font-size: 32px;
            text-align: right;
            padding: 10px;
            border: 2px solid rgb(65, 10, 82);
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }
        .clear-btn {
            background-color: #ff4444;
        }
        .clear-btn:hover {
            background-color: #ff6666;
        }
    </style>
</head>
<body>
<div class="main">
    <div id="display">0</div>
    <div class="one">
        <div class="div" data-value="1">1</div>
        <div class="div" data-value="2">2</div>
        <div class="div" data-value="3">3</div>
        <div class="div" data-value="+">+</div>
    </div>
    <div class="two">
        <div class="div" data-value="4">4</div>
        <div class="div" data-value="5">5</div>
        <div class="div" data-value="6">6</div>
        <div class="div" data-value="-">-</div>
    </div>
    <div class="three">
        <div class="div" data-value="7">7</div>
        <div class="div" data-value="8">8</div>
        <div class="div" data-value="9">9</div>
        <div class="div" data-value="*">*</div>
    </div>
    <div class="four">
        <div class="div" data-value="0">0</div>
        <div class="div" data-value="/">/</div>
        <div class="div" data-value=".">.</div>
        <div class="div" data-value="=">=</div>
    </div>
    <div class="btn">
        <button class="clear-btn">CLEAR</button>
    </div>
</div>
<script>
    const display = document.getElementById('display');
    const buttons = document.querySelectorAll('.div');
    const clearBtn = document.querySelector('.clear-btn');
    
    let currentInput = '';
    let firstOperand = null;
    let operator = null;
    let waitingForSecondOperand = false;

    function updateDisplay() {
        display.textContent = currentInput || '0';
    }

    function inputDigit(digit) {
        if (waitingForSecondOperand) {
            currentInput = digit;
            waitingForSecondOperand = false;
        } else {
            currentInput = currentInput === '0' ? digit : currentInput + digit;
        }
    }

    function inputDecimal() {
        if (waitingForSecondOperand) {
            currentInput = '0.';
            waitingForSecondOperand = false;
            return;
        }
        if (!currentInput.includes('.')) {
            currentInput += '.';
        }
    }

    function handleOperator(nextOperator) {
        const inputValue = parseFloat(currentInput);

        if (operator && waitingForSecondOperand) {
            operator = nextOperator;
            return;
        }

        if (firstOperand === null && !isNaN(inputValue)) {
            firstOperand = inputValue;
        } else if (operator) {
            const result = calculate(firstOperand, inputValue, operator);
            currentInput = `${parseFloat(result.toFixed(7))}`;
            firstOperand = result;
        }

        waitingForSecondOperand = true;
        operator = nextOperator;
    }

    function calculate(first, second, op) {
        switch (op) {
            case '+': return first + second;
            case '-': return first - second;
            case '*': return first * second;
            case '/': return second !== 0 ? first / second : 'Error';
            default: return second;
        }
    }

    buttons.forEach(button => {
        button.addEventListener('click', () => {
            const value = button.getAttribute('data-value');
            
            if ('0123456789'.includes(value)) {
                inputDigit(value);
                updateDisplay();
            } else if (value === '.') {
                inputDecimal();
                updateDisplay();
            } else if ('+-*/'.includes(value)) {
                handleOperator(value);
                updateDisplay();
            } else if (value === '=') {
                if (operator && !waitingForSecondOperand) {
                    const secondOperand = parseFloat(currentInput);
                    const result = calculate(firstOperand, secondOperand, operator);
                    currentInput = `${parseFloat(result.toFixed(7))}`;
                    firstOperand = null;
                    operator = null;
                    waitingForSecondOperand = false;
                    updateDisplay();
                }
            }
        });
    });

    clearBtn.addEventListener('click', () => {
        currentInput = '0';
        firstOperand = null;
        operator = null;
        waitingForSecondOperand = false;
        updateDisplay();
    });
</script>
</body>
</html>
